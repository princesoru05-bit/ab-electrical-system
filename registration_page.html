<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AB Electrical Engineering - Laporan Kerosakan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md p-6">
    <h2 class="text-2xl font-bold text-blue-900 mb-2">AB Electrical Engineering</h2>
    <p class="text-gray-600 mb-6 text-sm">Sila isi borang di bawah untuk perkhidmatan baiki barang elektrik.</p>

    <form action="/submit-service" method="POST" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nama Pelanggan</label>
        <input type="text" name="nama" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Nombor WhatsApp</label>
        <input type="tel" name="phone" placeholder="0123456789" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Alamat / Lokasi</label>
        <input type="text" name="alamat" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Jenis Barangan</label>
        <select name="jenis_barang" class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
          <option value="Mesin Basuh">Mesin Basuh</option>
          <option value="Peti Ais">Peti Ais</option>
          <option value="TV">TV / Televisyen</option>
          <option value="Lain-lain">Lain-lain</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Jenama & Model (Jika Ada)</label>
        <input type="text" name="model" placeholder="Contoh: Toshiba AW-F820S" class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Keterangan Masalah</label>
        <textarea name="masalah" rows="3" required placeholder="Contoh: Air tak keluar, berbunyi bising..." class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Muat Naik Gambar Kerosakan</label>
        <input type="file" name="gambar" accept="image/*" class="w-full mt-1 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-md font-semibold hover:bg-blue-700 transition duration-200">
        Hantar Laporan (Submit)
      </button>
    </form>
  </div>
</body>
</html>
